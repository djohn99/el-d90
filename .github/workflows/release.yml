name: Apple Silicon DMG release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      test_windows:
        description: Run experimental Windows validation (not published)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate runner and version tag
        id: version
        run: node scripts/release-metadata.cjs
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r scripts/requirements-dmg.txt
      - name: Dependency advisory gate
        run: npm audit --audit-level=low
      - name: Backend checks
        run: npm test
      - name: Package and ad-hoc sign
        run: |
          npm run package
          codesign --force --deep --sign - dist/el-d90-darwin-arm64/el-d90.app
          codesign --verify --deep --strict dist/el-d90-darwin-arm64/el-d90.app
          test "$(lipo -archs dist/el-d90-darwin-arm64/el-d90.app/Contents/MacOS/el-d90)" = arm64
          test "$(lipo -archs dist/el-d90-darwin-arm64/el-d90.app/Contents/Resources/app.asar.unpacked/assets/el-d90-pty)" = arm64
      - name: Packaged desktop acceptance checks
        env:
          EL_D90_APP_EXECUTABLE: ${{ github.workspace }}/dist/el-d90-darwin-arm64/el-d90.app/Contents/MacOS/el-d90
        run: npm run test:desktop-all
      - name: Create and verify drag-to-install DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/build-dmg.py --app dist/el-d90-darwin-arm64/el-d90.app
          hdiutil verify "dist/installers/el-d90-${VERSION}-mac-arm64.dmg"
          cd dist/installers
          shasum -a 256 "el-d90-${VERSION}-mac-arm64.dmg" > "el-d90-${VERSION}-mac-arm64.dmg.sha256"
          shasum -a 256 -c "el-d90-${VERSION}-mac-arm64.dmg.sha256"
      - name: Verify the app inside the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mount_path="${RUNNER_TEMP}/el-d90-release-check"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "dist/installers/el-d90-${VERSION}-mac-arm64.dmg"
          trap 'hdiutil detach "$mount_path"' EXIT
          codesign --verify --deep --strict "$mount_path/el-d90.app"
          test -L "$mount_path/Applications"
          cmp dist/el-d90-darwin-arm64/el-d90.app/Contents/Resources/app.asar "$mount_path/el-d90.app/Contents/Resources/app.asar"
      - name: Record build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/installers/*.dmg
      - name: Prepare release installation notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.cjs > dist/installers/RELEASE_NOTES.md
      - name: Retain verified build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.test_windows
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - name: Validate runner and version
        id: version
        run: node scripts/release-metadata.cjs
      - name: Install locked dependencies and build Windows app
        run: |
          npm ci
          npm audit --audit-level=low
          npm run package:windows
      - name: Install verified test kubectl
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kubectl'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir 'kubectl.exe'
          $url = 'https://dl.k8s.io/release/v1.36.1/bin/windows/amd64/kubectl.exe'
          Invoke-WebRequest $url -OutFile $exe
          $expected = (Invoke-RestMethod "$url.sha256").Trim()
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $expected.ToLower()) { throw 'kubectl checksum mismatch' }
          $dir >> $env:GITHUB_PATH
      - name: Native Windows acceptance
        run: node test/windows-smoke.cjs
      - name: Create portable ZIP and checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/installers | Out-Null
          $name = "el-d90-$env:VERSION-windows-x64.zip"
          $target = Join-Path 'dist/installers' $name
          Compress-Archive -Path dist/el-d90-win32-x64/* -DestinationPath $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$target.sha256", "$hash  $name`n", [Text.Encoding]::ASCII)
      - name: Record Windows build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/installers/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-files
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          shasum -a 256 -c "el-d90-${VERSION}-mac-arm64.dmg.sha256"
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' existing-release.json >/dev/null; then
              echo 'This tag already has a published release; refusing to replace its assets.' >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "el-d90 ${VERSION}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" "el-d90-${VERSION}-mac-arm64.dmg" "el-d90-${VERSION}-mac-arm64.dmg.sha256" --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          echo "### Published el-d90 ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
